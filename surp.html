<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloo babii</title>
    <style>
        body {
            background-color: #ffe6e6;
            font-family: 'Segoe UI', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: #4a4a4a;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            background-color: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            color: #ff4d6d;
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        h2 {
            color: #ff758f;
            font-size: 1.5em;
            margin-top: 0;
            font-weight: 400;
        }
        .heart {
            font-size: 40px;
            color: #ff4d6d;
            animation: heartbeat 1.2s infinite;
            margin: 20px 0;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.1); }
            40% { transform: scale(1.05); }
            60% { transform: scale(1.15); }
            80% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        .lyrics {
            font-size: 1.2em;
            line-height: 1.8;
            font-style: italic;
            color: #5c5c5c;
            background-color: #fff0f3;
            padding: 20px;
            border-radius: 15px;
            margin: 30px 0;
        }
        .message {
            font-size: 1.1em;
            line-height: 1.6;
            border-top: 2px dashed #ffe6e6;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="message">
            <p><strong> </strong></p>
            <p> </p>
            <p><br><strong></strong></p>
        </div>
    </div> 
    <!-- Audio Player -->
     <div style="margin: 20px 0;">
        <p style="font-size: 0.9em; color: #ff758f; font-weight: bold; margin-bottom: 5px;">Press Play for Music 🎵</p>
        <audio controls>
            <source src="ewan.mp3.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
     </div>
    <!-- The Surprise Button-->

</body>
</html>
