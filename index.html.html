<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloo babii</title>
    <style>
        .love-pop {
            position: absolute;
            font-size: 1.1em;
            font-weight: bold;
            color: #ff4d6d;
            text-shadow: 0 2px 5px rgba(255, 77, 109, 0.3);
            pointer-events: none;
            z-index: 999999;
            white-space: nowrap;
            margin-left: 0;
            margin-right: 0;
            transform: translate(-50%, -50%);
            animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% {transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            15% {transform: translate(-50%, -100%) scale(1.1); opacity: 1; }
            100% {transform: translate(-50%, -300%) scale(1); opacity: 0; }
        }
        body {
            background-color: #ffe6e6;
            font-family: 'Segoe UI', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: #4a4a4a;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            background-color: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            color: #ff4d6d;
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        h2 {
            color: #ff758f;
            font-size: 1.5em;
            margin-top: 0;
            font-weight: 400;
        }
        .heart {
            font-size: 60px;
            color: #ff4d6d;
            animation: heartbeat 1.2s infinite;
            margin: 20px 0;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.1); }
            40% { transform: scale(1.05); }
            60% { transform: scale(1.15); }
            80% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        .lyrics {
            font-size: 1.2em;
            line-height: 1.8;
            font-style: italic;
            color: #5c5c5c;
            background-color: #fff0f3;
            padding: 20px;
            border-radius: 15px;
            margin: 30px 0;
        }
        .message {
            font-size: 1.1em;
            line-height: 1.6;
            border-top: 2px dashed #ffe6e6;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h1>Ewan</h1>
        <h2>APO Hiking Society</h2>

        <div class="lyrics">
            "Mahal kita, mahal kita, hindi ito bola"<br>
        </div>

        <div class="message">
            <p><strong> </strong></p>
            <p> </p>
            <p><br><strong></strong></p>
        </div>
    </div> 
    <!-- Audio Player -->
     <div style="margin: 20px 0;">
        <p style="font-size: 0.9em; color: #ff758f; font-weight: bold; margin-bottom: 5px;">Press Play for Music 🎵</p>
        <audio controls>
            <source src="ewan.mp3.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
     </div>
    <!-- The Surprise Button-->
     <button onclick="revealSurprise()" style="
     background-color: #ff4d6d;
     color: white;
     border: none;
     padding: 15px 30px;
     font-size: 1.1em;
     font-weight: bold;
     border-radius: 50px;
     cursor: pointer;
     box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
     margin-top: 20px;
     transition: transform 0.2s;
     " onmouseover="This.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
       click mo hehehe
    </button>

    <!-- New script for exploading heart effect-->
     <script>
        function revealSurprise() {
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.innerHTML= '❤️';

                heart.style.position = 'fixed';
                heart.style.fontSize = Math.random() * (30 - 15) + 15 + 'px';
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '9999';

                heart.style.left = '50%';
                heart.style.top = '75%';

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 200 + 50;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                heart.animate([
                    { transform: 'translate(-50%, -50%) scale(0.5)', opacity: 1},
                    { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.5)`, opacity: 0.8 },
                    { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 1200,
                    easing: 'ease-out',
                    fill: 'forwards'
                });
                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 1200);
            }
            setTimeout(() => {
                alert("I just want to remind you that you are my favorite person in the whole universe. I love you so much ");
            }, 600);
        }
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.tagName ==='AUDIO') return;

            const pop = document.createElement('div');
            pop.innerHTML = 'I love you';
            pop.className = 'love-pop';

            pop.style.left = e.clientX + 'px';
            pop.style.right = e.clientY + 'px';

            document.body.appendChild(pop);

            setTimeout(() => pop.remove(), 1200);
        });
     </script>
</body>
</html>
